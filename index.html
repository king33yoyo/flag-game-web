<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="世界插旗挑战:把国旗拖到地图上的正确位置,六大洲 170 个国家任你挑战,测测你的地理水平!">
  <meta name="theme-color" content="#FFF8EC">
  <meta property="og:title" content="世界插旗挑战">
  <meta property="og:description" content="把国旗拖到地图上的正确位置,六大洲 170 个国家任你挑战!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://king33yoyo.github.io/flag-game-web/">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>世界插旗挑战</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <script src="vendor/leaflet.js"></script>
  <style>

    /* ===== Global Reset ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ===== Candy Design Tokens ===== */
    :root {
      --bg: #FFF8EC;
      --bg-deep: #FFEFD6;
      --ink: #3B2C35;
      --ink-soft: #92818B;
      --card: #FFFFFF;
      --pink: #FF7BAC;
      --orange: #FF9F43;
      --yellow: #FFD43B;
      --green: #51CF66;
      --green-deep: #37B24D;
      --blue: #4DABF7;
      --blue-deep: #1C7ED6;
      --purple: #9775FA;
      --red: #FF6B6B;
      --gold: #F59E0B;
      --shadow-pop: 0 5px 0 rgba(59, 44, 53, 0.12);
      --shadow-pop-lg: 0 8px 0 rgba(59, 44, 53, 0.14);
      --border-pop: 3px solid var(--ink);
      --bouncy: cubic-bezier(0.34, 1.56, 0.64, 1);
      --font-candy: "Comic Sans MS", "Chalkboard SE", "Yuanti SC", "YouYuan", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* ===== Base Styles ===== */
    body {
      font-family: var(--font-candy);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: none;
    }

    h1, h2, h3 {
      font-family: var(--font-candy);
    }

    /* ===== Page Switching ===== */
    .page {
      display: none;
      flex-direction: column;
      height: 100vh;
      touch-action: none;
    }

    .page.visible {
      display: flex;
    }

    /* ===== Navigation Bar ===== */
    .nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      border-bottom: var(--border-pop);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
    }

    .nav-logo svg {
      width: 34px;
      height: 34px;
      filter: drop-shadow(0 2px 0 rgba(59, 44, 53, 0.18));
    }

    .nav-spacer {
      width: 60px;
    }

    /* ===== Home Page ===== */
    .home-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 24px 24px;
      gap: 0;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: pan-y;
      background:
        radial-gradient(circle at 15% 25%, rgba(255, 212, 59, 0.20), transparent 32%),
        radial-gradient(circle at 85% 18%, rgba(77, 171, 247, 0.18), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(255, 123, 172, 0.16), transparent 34%),
        radial-gradient(circle at 10% 85%, rgba(151, 117, 250, 0.14), transparent 30%),
        var(--bg);
    }

    .home-content::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 780px;
      height: 780px;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.30), rgba(255, 255, 255, 0) 62%),
        url('assets/globe.webp') center/cover no-repeat;
      border-radius: 50%;
      opacity: 0.45;
      pointer-events: none;
    }

    /* Floating candy decorations */
    .home-deco {
      position: absolute;
      font-size: 2rem;
      opacity: 0.55;
      pointer-events: none;
      animation: deco-bob 5s ease-in-out infinite;
      filter: drop-shadow(0 4px 0 rgba(59, 44, 53, 0.10));
    }
    .home-deco.d1 { top: 14%; left: 8%;  animation-delay: 0s; }
    .home-deco.d2 { top: 22%; right: 10%; animation-delay: 1.2s; }
    .home-deco.d3 { top: 48%; left: 14%; animation-delay: 2.1s; }
    .home-deco.d4 { top: 55%; right: 8%;  animation-delay: 0.6s; }
    .home-deco.d5 { top: 36%; right: 30%; animation-delay: 1.8s; }

    @keyframes deco-bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-16px) rotate(5deg); }
    }

    .hero-section {
      text-align: center;
      position: relative;
      z-index: 1;
      margin-top: 110px;
      margin-bottom: 32px;
      flex-shrink: 0;
    }

    .hero-badge {
      display: inline-block;
      padding: 8px 22px;
      border-radius: 100px;
      background: var(--yellow);
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
      border: var(--border-pop);
      box-shadow: var(--shadow-pop);
    }

    .hero-section h1 {
      font-size: 3.6rem;
      line-height: 1.2;
      color: var(--ink);
      margin-bottom: 16px;
    }

    .hero-section h1 .highlight {
      display: inline-block;
      background: linear-gradient(135deg, #FF9F43, #FFD43B);
      color: var(--ink);
      padding: 0 14px;
      border-radius: 16px;
      border: var(--border-pop);
      box-shadow: var(--shadow-pop);
      transform: rotate(-1.5deg);
    }

    .hero-subtitle {
      font-size: 1.35rem;
      color: var(--ink-soft);
      font-weight: 400;
    }

    .continent-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      max-width: 1200px;
      width: 100%;
      position: relative;
      z-index: 1;
      flex: 1;
      align-content: end;
      padding-bottom: 32px;
    }

    .continent-card {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      cursor: pointer;
      height: 250px;
      transition: transform 0.3s var(--bouncy), box-shadow 0.3s ease;
      opacity: 0;
      animation: cardEntry 0.5s ease forwards;
      background: var(--card);
      border: var(--border-pop);
      box-shadow: var(--shadow-pop-lg);
    }

    .continent-card:nth-child(1) { animation-delay: 0.05s; }
    .continent-card:nth-child(2) { animation-delay: 0.1s; }
    .continent-card:nth-child(3) { animation-delay: 0.15s; }
    .continent-card:nth-child(4) { animation-delay: 0.2s; }
    .continent-card:nth-child(5) { animation-delay: 0.25s; }
    .continent-card:nth-child(6) { animation-delay: 0.3s; }

    @keyframes cardEntry {
      from { opacity: 0; transform: translateY(24px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .continent-card:hover {
      transform: translateY(-6px) scale(1.02) rotate(-0.4deg);
      box-shadow: 0 12px 0 rgba(59, 44, 53, 0.14);
    }

    .continent-card:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 3px 0 rgba(59, 44, 53, 0.14);
    }

    .continent-card .card-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.4s ease;
    }

    /* candy tint washed over the photo so cards still feel part of the palette */
    .continent-card .card-tint {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .continent-card:hover .card-bg {
      transform: scale(1.08);
    }

    .continent-card .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(59, 44, 53, 0.72) 100%);
    }

    .continent-card .card-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      z-index: 1;
    }

    .continent-card .card-name {
      font-weight: 700;
      font-size: 1.25rem;
      color: #FFFFFF;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 2px 0 rgba(59, 44, 53, 0.35);
    }

    .continent-card .card-name .card-emoji {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #FFFFFF;
      border: 2.5px solid var(--ink);
      font-size: 1.4rem;
      flex-shrink: 0;
      box-shadow: 0 3px 0 rgba(59, 44, 53, 0.18);
    }

    .continent-card .card-count {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.92);
    }

    .continent-card .card-best {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 12px;
      border-radius: 100px;
      background: var(--yellow);
      border: 2px solid var(--ink);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--ink);
    }

    /* ===== Slot Pulse Animation ===== */
    @keyframes gold-pulse {
      0%, 100% { border-color: var(--orange); box-shadow: 0 0 0 4px rgba(255, 159, 67, 0.25); transform: translate(-50%, -50%) scale(1); }
      50% { border-color: var(--yellow); box-shadow: 0 0 0 8px rgba(255, 212, 59, 0.30); transform: translate(-50%, -50%) scale(1.08); }
    }

    @keyframes card-glow {
      0%, 100% { box-shadow: 0 5px 0 rgba(59, 44, 53, 0.12), 0 0 0 0 rgba(255, 212, 59, 0.45); }
      50% { box-shadow: 0 5px 0 rgba(59, 44, 53, 0.12), 0 0 0 10px rgba(255, 212, 59, 0); }
    }

    @keyframes flag-drop {
      0% { opacity: 0; transform: translate(-50%, -150%) scale(0.6); }
      60% { transform: translate(-50%, -85%) scale(1.15); }
      100% { opacity: 1; transform: translate(-50%, -100%) scale(1); }
    }

    @keyframes score-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    /* Touch drag clone */
    .touch-clone {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      transform: scale(1.15) rotate(-3deg);
      opacity: 0.95;
      background: #FFFFFF;
      border: 3px solid var(--ink);
      border-radius: 14px;
      padding: 6px 14px;
      color: var(--ink);
      font-weight: 700;
      box-shadow: var(--shadow-pop);
    }

    /* Country highlight for drag */
    .country-path.drag-highlight {
      fill: rgba(255, 159, 67, 0.42);
      stroke: var(--orange);
      stroke-width: 3;
    }

    .country-path.filled {
      fill: rgba(81, 207, 102, 0.42);
      stroke: var(--green-deep);
      stroke-width: 2.5;
      pointer-events: none;
    }

    /* ===== Pause state: block every interaction ===== */
    .pause-overlay {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(255, 248, 236, 0.72);
      backdrop-filter: blur(4px);
      color: var(--ink);
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.6;
    }
    .pause-overlay span {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--ink-soft);
    }
    #page-game.paused .pause-overlay { display: flex; cursor: pointer; }
    #page-game.paused .task-panel,
    #page-game.paused .zoom-controls,
    #page-game.paused .back-btn,
    #page-game.paused .hint-toggle { pointer-events: none; }
    #page-game.paused .country-path { pointer-events: none !important; }

    /* ===== Game Page ===== */
    #page-game {
      flex-direction: row !important;
      padding-top: 60px;
      background: var(--bg);
    }

    .map-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .game-header {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #FFFFFF;
      border: var(--border-pop);
      border-radius: 100px;
      z-index: 10;
      min-width: 280px;
      gap: 12px;
      box-shadow: var(--shadow-pop);
    }

    .game-header .back-btn {
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--ink);
      transition: transform 0.15s var(--bouncy), color 0.2s;
      padding: 4px 8px;
    }

    .game-header .back-btn:hover {
      transform: translateX(-2px) scale(1.15);
      color: var(--red);
    }

    .game-header .region-name {
      font-weight: 700;
      font-size: 1rem;
      color: var(--ink);
    }

    .game-header .header-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .game-header .score-display {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--green-deep);
    }

    .game-header .timer-display {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--blue-deep);
    }

    .game-header .hint-toggle {
      background: var(--bg);
      border: 2px solid var(--ink);
      border-radius: 10px;
      color: var(--ink);
      font-size: 1rem;
      cursor: pointer;
      padding: 3px 8px;
      transition: all 0.15s var(--bouncy);
      opacity: 1;
      box-shadow: 0 3px 0 rgba(59, 44, 53, 0.14);
    }

    .game-header .hint-toggle:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(59, 44, 53, 0.14);
    }

    .game-header .hint-toggle.off {
      opacity: 0.45;
      background: #FFFFFF;
    }

    .game-header .hint-toggle:hover {
      border-color: var(--ink);
      background: var(--yellow);
    }

    .map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      touch-action: none;
      /* candy ocean: no tile layer, fully self-drawn map */
      background:
        radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.35) 2.5px, transparent 3px),
        radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.22) 2px, transparent 2.5px),
        linear-gradient(180deg, #D8EFFF 0%, #BFE3F9 100%);
      background-size: 64px 64px, 64px 64px, 100% 100%;
    }

    /* inert silhouettes of the non-active continents */
    .country-bg {
      fill: rgba(255, 255, 255, 0.55);
      stroke: rgba(59, 44, 53, 0.22);
      stroke-width: 1;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .slot-marker {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      color: var(--orange);
      transform: translate(-50%, -50%);
      animation: gold-pulse 2s ease-in-out infinite;
      pointer-events: auto;
      cursor: pointer;
    }

    .slot-marker.filled {
      background: var(--green);
      border-color: var(--ink);
      color: #FFFFFF;
      animation: none;
      font-size: 16px;
    }

    .slot-marker.wrong {
      background: var(--red);
      border-color: var(--ink);
      color: #FFFFFF;
      animation: none;
    }

    /* ===== Task Panel ===== */
    .task-panel {
      width: 280px;
      flex-shrink: 0;
      background: #FFFFFF;
      border-right: var(--border-pop);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 16px;
      overflow-y: auto;
      touch-action: pan-y;
    }

    .task-panel::-webkit-scrollbar {
      width: 6px;
    }

    .task-panel::-webkit-scrollbar-thumb {
      background: rgba(59, 44, 53, 0.18);
      border-radius: 3px;
    }

    .current-flag-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      background: linear-gradient(160deg, #FFF3D6, #FFE3B3);
      border: var(--border-pop);
      border-radius: 20px;
      animation: card-glow 2s ease-in-out infinite;
      text-align: center;
      cursor: grab;
      user-select: none;
      box-shadow: var(--shadow-pop);
    }

    .current-flag-card .current-flag-emoji {
      font-size: 3rem;
      margin-bottom: 8px;
      animation: emoji-bounce 1.6s ease-in-out infinite;
    }

    @keyframes emoji-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.06); }
    }

    .current-flag-card .current-flag-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--ink);
    }

    .current-flag-card .drag-hint {
      font-size: 0.75rem;
      color: var(--ink-soft);
      margin-top: 4px;
    }

    .flag-queue {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .flag-queue-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 100px;
      user-select: none;
      transition: background 0.2s, border-color 0.2s;
      border: 2.5px solid transparent;
      font-size: 0.85rem;
      color: var(--ink-soft);
    }

    .flag-queue-item.active {
      background: #E7F5FF;
      border-color: var(--blue);
      color: var(--ink);
      cursor: grab;
      font-weight: 700;
    }

    .flag-queue-item.completed {
      text-decoration: line-through;
      opacity: 0.45;
      cursor: default;
    }

    .flag-queue-item .queue-emoji {
      font-size: 1.2rem;
    }

    .flag-queue-item .queue-name {
      flex: 1;
      font-weight: 600;
    }

    .progress-bar-container {
      margin-top: auto;
      padding-top: 8px;
    }

    .progress-bar-container .progress-label {
      font-size: 0.75rem;
      color: var(--ink-soft);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .progress-bar {
      height: 12px;
      border-radius: 100px;
      background: var(--bg-deep);
      border: 2px solid var(--ink);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, var(--orange), var(--yellow));
      transition: width 0.4s var(--bouncy);
    }

    /* ===== Drag Hit Area ===== */
    .drag-hit-area {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      cursor: pointer;
      pointer-events: auto;
    }

    /* ===== Zoom Controls ===== */
    .zoom-controls {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: #FFFFFF;
      border: var(--border-pop);
      border-radius: 18px;
      padding: 8px;
      box-shadow: var(--shadow-pop);
    }

    .zoom-controls button {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 2.5px solid var(--ink);
      background: var(--yellow);
      color: var(--ink);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s var(--bouncy);
      box-shadow: 0 3px 0 rgba(59, 44, 53, 0.18);
    }

    .zoom-controls button:hover {
      background: var(--orange);
    }

    .zoom-controls button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(59, 44, 53, 0.18);
    }

    .zoom-controls input[type="range"] {
      writing-mode: vertical-lr;
      direction: rtl;
      width: 28px;
      height: 100px;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
    }

    .zoom-controls input[type="range"]::-webkit-slider-runnable-track {
      width: 6px;
      background: var(--bg-deep);
      border-radius: 3px;
      border: 1.5px solid rgba(59, 44, 53, 0.25);
    }

    .zoom-controls input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--blue);
      border: 2.5px solid var(--ink);
      cursor: pointer;
      margin-left: -6px;
    }

    .country-path {
      fill: rgba(255, 255, 255, 0.45);
      stroke: var(--blue-deep);
      stroke-width: 1.8;
      stroke-linejoin: round;
      cursor: pointer;
      transition: fill 0.2s ease, stroke 0.2s ease;
    }

    .country-path:hover {
      fill: rgba(77, 171, 247, 0.38);
      stroke: var(--blue-deep);
      stroke-width: 2.6;
    }

    .country-path.wrong-flash {
      fill: rgba(255, 107, 107, 0.45);
      stroke: var(--red);
    }

    /* ===== Flag Marker (placed on map) ===== */
    .flag-marker {
      position: absolute;
      font-size: 26px;
      transform: translate(-50%, -100%);
      pointer-events: none;
      animation: flag-drop 0.45s var(--bouncy) forwards;
      z-index: 5;
      filter: drop-shadow(0 3px 0 rgba(59, 44, 53, 0.25));
    }

    /* ===== Result Page ===== */
    .result-content {
      flex: 1;
      display: flex;

      align-items: center;
      justify-content: center;
      padding: 80px 20px 40px;

        radial-gradient(circle at 20% 20%, rgba(255, 212, 59, 0.22), transparent 35%),

    .result-card {

    .result-header h2 {
      font-size: 1.6rem;
      color: var(--ink);

    .result-header .best-badge.new-record {

    .score-ring {

    .score-ring-inner {

      align-items: center;

      font-weight: 700;

    .result-stats {

    }

    .result-stat {

    .result-stat .stat-value {

    .stat-correct { background: #D3F9D8; }

    /* ===== Responsive Design ===== */
    @media (max-width: 640px) {

  </style>
</head>

  <script src="data.js"></script>
  <script>
    // ===== Page Switching =====
    function showPage(id) {
      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('visible');
      });
      document.getElementById('page-' + id).classList.add('visible');
    }

    // ===== Sound Effects (Web Audio API) =====
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function playSound(type) {
      try {
        const ctx = getAudioCtx();
        if (type === 'correct') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = 800;
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.15);
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = 300;
          osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.2);
        } else if (type === 'complete') {
          [523, 659, 784].forEach((freq, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.frequency.value = freq;
            o.type = 'sine';
            g.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.15);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.2);
            o.start(ctx.currentTime + i * 0.15);
            o.stop(ctx.currentTime + i * 0.15 + 0.2);
          });
        }
      } catch(e) {}
    }

    // ===== Best Score Persistence =====
    function getBest(continentKey) {
      try {
        const raw = localStorage.getItem('flagGameBest.' + continentKey);
        return raw ? JSON.parse(raw) : null; // {score, total, errors, timeSec}
      } catch (e) { return null; }
    }

    function formatTimeSec(sec) {
      const mins = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${mins}:${s}`;
    }

    // Higher score wins, then shorter time, then fewer errors
    function saveBestIfBetter(continentKey, result) {
      const best = getBest(continentKey);
      const isBetter = !best
        || result.score > best.score
        || (result.score === best.score && result.timeSec < best.timeSec)
        || (result.score === best.score && result.timeSec === best.timeSec && result.errors < best.errors);
      if (isBetter) {
        try { localStorage.setItem('flagGameBest.' + continentKey, JSON.stringify(result)); } catch (e) {}
        return true;
      }
      return false;
    }

    // ===== Continent Data =====
    // country counts are derived from COUNTRY_DATA at render time
    const CONTINENTS = {
      asia:         { name: "亚洲",   emoji: "🌏", color: "#FEE2E2", textColor: "#991B1B", accent: "#F87171", image: "assets/asia.webp" },
      europe:       { name: "欧洲",   emoji: "🌍", color: "#DBEAFE", textColor: "#1E3A8A", accent: "#60A5FA", image: "assets/europe.webp" },
      africa:       { name: "非洲",   emoji: "🌍", color: "#FEF3C7", textColor: "#92400E", accent: "#FBBF24", image: "assets/africa.webp" },
      southAmerica: { name: "南美洲", emoji: "🌎", color: "#D1FAE5", textColor: "#065F46", accent: "#34D399", image: "assets/south-america.webp" },
      northAmerica: { name: "北美洲", emoji: "🌎", color: "#EDE9FE", textColor: "#5B21B6", accent: "#A78BFA", image: "assets/north-america.webp" },
      oceania:      { name: "大洋洲", emoji: "🌏", color: "#CFFAFE", textColor: "#155E75", accent: "#22D3EE", image: "assets/oceania.webp" }
    };

    // ===== Game State =====
    const gameState = {
      continent: null,
      countries: [],
      score: 0,
      errors: [],
      startTime: null,
      timerInterval: null,
      isComplete: false,
      paused: false,
      pausedTime: 0,
      pauseStart: null
    };

    // Touch drag state
    let touchDragState = {
      active: false,
      countryId: null,
      clone: null,
      chip: null,
      highlightedPath: null
    };
    let desktopDragClone = null;

    // ===== Start Game =====
    function startGame(key) {
      gameState.continent = key;
      showPage('game');
    }

    // ===== Render Continent Grid =====
    function renderContinentGrid() {
      const grid = document.getElementById('continent-grid');
      grid.innerHTML = '';
      let index = 0;
      for (const [key, continent] of Object.entries(CONTINENTS)) {
        const card = document.createElement('div');
        card.className = 'continent-card';
        card.style.animationDelay = (0.05 + index * 0.06) + 's';
        card.onclick = () => startGame(key);
        const countryCount = (COUNTRY_DATA[key] || []).length;
        const best = getBest(key);
        const bestBadge = best ? `<div class="card-best">🏆 最佳 ${best.score}/${best.total} · ${formatTimeSec(best.timeSec)}</div>` : '';
        card.innerHTML = `
          <div class="card-bg" style="background-image:url('${continent.image}')"></div>
          <div class="card-tint" style="background:linear-gradient(180deg, ${continent.accent}26 0%, transparent 45%)"></div>
          <div class="card-overlay"></div>
          <div class="card-info">
            <div class="card-name"><span class="card-emoji">${continent.emoji}</span>${continent.name}</div>
            <div class="card-count">${countryCount} 个国家 · 每局随机 10 题</div>
            ${bestBadge}
          </div>
        `;
        grid.appendChild(card);
        index++;
      }
    }

    // ===== Initialize =====
    renderContinentGrid();

    // ===== Leaflet Map Instance =====
    let leafletMap = null;

    function forEachCoord(countries, fn) {
      countries.forEach(c => {
        const rings = c.geo.type === 'MultiPolygon'
          ? c.geo.coordinates.map(p => p[0])
          : [c.geo.coordinates[0]];
        rings.forEach(ring => ring.forEach(([lon, lat]) => fn(lon, lat)));
      });
    }

    // Clear the transient pan transform once moveend has reprojected the overlays
    function resetOverlayTransform() {
      ['map-svg', 'flag-markers', 'slot-markers', 'drag-hit-areas'].forEach(id => {
        document.getElementById(id).style.transform = '';
      });
    }

;


    // ===== Game Rendering Functions =====

    function initGame() {
      const allCountries = COUNTRY_DATA[gameState.continent] || [];
      const shuffled = [...allCountries].sort(() => Math.random() - 0.5);
      gameState.countries = shuffled.slice(0, Math.min(10, shuffled.length)).map(c => ({...c, placed: false}));
      gameState.score = 0;
      gameState.errors = [];
      gameState.isComplete = false;
      gameState.paused = false;
      gameState.pausedTime = 0;
      gameState.pauseStart = null;
      document.getElementById('page-game').classList.remove('paused');
      document.getElementById('pause-btn').textContent = '⏸';
      gameState.startTime = Date.now();
      startTimer();
      renderMap();
      renderTaskPanel();
    }

    function renderMap() {
      const container = document.getElementById('map-container');
      const rect = container.getBoundingClientRect();
      const width = rect.width || 800;
      const height = rect.height || 500;

      // Initialize or update Leaflet map.
      // No tile layer: free tile providers (CARTO, OSM) now watermark their
      // tiles, so the world is drawn entirely from our own GeoJSON instead.
      if (!leafletMap) {
        leafletMap = L.map('leaflet-map', {
          zoomControl: false,
          attributionControl: false,
          dragging: true,
          scrollWheelZoom: true,
          doubleClickZoom: false,
          touchZoom: true,
          keyboard: false,
          boxZoom: false,
          zoomSnap: 0.5,
          zoomAnimation: false,   // with no tiles, animated zoom would leave the SVG static then snap
          minZoom: 2,
          maxZoom: 8,
          maxBounds: [[-58, -185], [80, 185]],  // keep the drawn world in reach
          maxBoundsViscosity: 1.0
        });
      }

      // Fit to continent bounds
      const countries = COUNTRY_DATA[gameState.continent] || [];
      let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
      forEachCoord(countries, (lon, lat) => {
        // For Europe, exclude Russia's far-east (negative longitudes) and clip to main Europe
        if (gameState.continent === 'europe') {
          if (lon < -10) return;  // skip far-east Russia, Kamchatka etc.
          if (lon > 45) lon = 45;
          if (lat > 72) lat = 72;
        }
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
      });
      const pad = gameState.continent === 'europe' ? 2 : 1;
      leafletMap.fitBounds([[minLat - pad, minLon - pad], [maxLat + pad, maxLon + pad]], { animate: false });
      const zoomByContinent = { asia: 0.25, africa: 0.2, oceania: 0.05, southAmerica: 0.2, northAmerica: 0.2 };
      const extraZoom = zoomByContinent[gameState.continent] || 0;
      if (extraZoom) {
        leafletMap.setZoom(leafletMap.getZoom() + extraZoom, { animate: false });
      }

      // Sync zoom slider
      const slider = document.getElementById('zoom-slider');
      if (slider) {
        slider.min = 2;
        slider.max = 8;
        slider.step = 0.5;
        slider.value = leafletMap.getZoom();
      }

      // Keep the SVG overlay and markers in sync with pan/zoom
      if (!leafletMap._zoomHandlerAttached) {
        // Pan feedback: shift the overlays along with the map while dragging.
        // containerPointToLayerPoint([0,0]) equals -mapPanePos, so the
        // overlays (drawn in container coords) must move by its inverse.
        leafletMap.on('move', () => {
          const origin = leafletMap.containerPointToLayerPoint([0, 0]);
          const t = `translate(${-origin.x}px, ${-origin.y}px)`;
          ['map-svg', 'flag-markers', 'slot-markers', 'drag-hit-areas'].forEach(id => {
            document.getElementById(id).style.transform = t;
          });
        });
        // No tiles and no zoom animation: reproject immediately on every zoom
        // step so wheel/button/slider zoom feels continuous instead of snapping
        leafletMap.on('zoom', () => {
          resetOverlayTransform();
          renderSvgOverlay(COUNTRY_DATA[gameState.continent] || []);
          renderSlotMarkers();
          renderPlacedFlags();
          const slider = document.getElementById('zoom-slider');
          if (slider) slider.value = leafletMap.getZoom();
        });
        leafletMap.on('zoomend moveend', () => {
          resetOverlayTransform();
          renderSvgOverlay(COUNTRY_DATA[gameState.continent] || []);
          renderSlotMarkers();
          renderPlacedFlags();
          const slider = document.getElementById('zoom-slider');
          if (slider) slider.value = leafletMap.getZoom();
        });
        leafletMap._zoomHandlerAttached = true;
      }

      // Render SVG overlay after the layout has settled
      setTimeout(() => {
        renderSvgOverlay(countries);
        renderSlotMarkers(); // 必须在 SVG 渲染之后，才能绑定 country-path 事件
      }, 300);
    }

    function countryPathD(country) {
      const rings = country.geo.type === 'MultiPolygon'
        ? country.geo.coordinates.map(p => p[0])
        : [country.geo.coordinates[0]];
      let d = '';
      rings.forEach(ring => {
        const points = ring.map(([lon, lat]) => {
          const pt = leafletMap.latLngToContainerPoint([lat, lon]);
          return `${pt.x.toFixed(1)},${pt.y.toFixed(1)}`;
        });
        if (points.length > 2) {
          d += `M${points.join('L')}Z`;
        }
      });
      return d;
    }

    function renderSvgOverlay(countries) {
      const svg = document.getElementById('map-svg');
      const container = document.getElementById('map-container');
      const rect = container.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;

      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);

      // Background: every other continent's countries, muted and inert
      const currentIds = new Set(countries.map(c => c.id));
      let svgContent = '';
      Object.values(COUNTRY_DATA).flat().forEach(country => {
        if (currentIds.has(country.id)) return;
        const d = countryPathD(country);
        if (d) svgContent += `<path d="${d}" class="country-bg"/>`;
      });

      // Foreground: the playable continent
      countries.forEach(country => {
        const d = countryPathD(country);
        if (d) {
          svgContent += `<path d="${d}" class="country-path" data-id="${country.id}" data-name="${country.name}" stroke-linejoin="round"/>`;
        }
      });
      svg.innerHTML = svgContent;

      // Enable pointer events and rebind interactions on every rebuild:
      // svg.innerHTML replacement discards old nodes along with their listeners
      svg.querySelectorAll('.country-path').forEach(path => {
        path.style.pointerEvents = 'auto';
        path.addEventListener('mouseenter', () => {
          if (!path.classList.contains('filled')) {
            path.style.fill = 'rgba(77, 171, 247, 0.38)';
            path.style.stroke = '#1C7ED6';
            path.style.strokeWidth = '2.6';
          }
        });
        path.addEventListener('mouseleave', () => {
          if (!path.classList.contains('filled')) {
            path.style.fill = 'rgba(255, 255, 255, 0.45)';
            path.style.stroke = '#1C7ED6';
            path.style.strokeWidth = '1.8';
          }
        });
        path.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (!path.classList.contains('filled')) {
            path.classList.add('drag-highlight');
          }
        });
        path.addEventListener('dragleave', () => {
          path.classList.remove('drag-highlight');
        });
        path.addEventListener('drop', (e) => {
          e.preventDefault();
          path.classList.remove('drag-highlight');
          if (gameState.paused) return;
          const draggedId = e.dataTransfer.getData('text/plain');
          const targetId = path.dataset.id;
          if (draggedId === targetId) {
            placeFlag(draggedId, targetId);
          } else {
            wrongDrop(draggedId, targetId);
          }
        });
      });
    }

    function bindDragEvents(element, country) {
      element.draggable = true;
      element.dataset.id = country.id;

      element.addEventListener('dragstart', (e) => {
        if (gameState.paused) { e.preventDefault(); return; }
        e.dataTransfer.setData('text/plain', country.id);
        e.dataTransfer.effectAllowed = 'move';

        // 隐藏原生 ghost
        const img = new Image();
        img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
        e.dataTransfer.setDragImage(img, 0, 0);

        // 创建自定义克隆元素（与触摸端一致）
        const clone = document.createElement('div');
        clone.className = 'touch-clone';
        clone.textContent = country.flag + ' ' + country.name;
        clone.id = 'desktop-drag-clone';
        document.body.appendChild(clone);
        desktopDragClone = clone;

        requestAnimationFrame(() => {
          element.style.opacity = '0.5';
        });
      });
      element.addEventListener('drag', (e) => {
        if (desktopDragClone && e.clientX !== 0 && e.clientY !== 0) {
          desktopDragClone.style.left = (e.clientX - 30) + 'px';
          desktopDragClone.style.top = (e.clientY - 30) + 'px';
        }
      });
      element.addEventListener('dragend', () => {
        element.style.opacity = '1';
        if (desktopDragClone) {
          desktopDragClone.remove();
          desktopDragClone = null;
        }
      });

      element.addEventListener('touchstart', (e) => {
        if (gameState.paused) return;
        e.preventDefault();
        const touch = e.touches[0];
        touchDragState.active = true;
        touchDragState.countryId = country.id;
        touchDragState.chip = element;

        const clone = document.createElement('div');
        clone.className = 'touch-clone';
        clone.textContent = country.flag + ' ' + country.name;
        clone.style.left = (touch.clientX - 50) + 'px';
        clone.style.top = (touch.clientY - 30) + 'px';
        document.body.appendChild(clone);
        touchDragState.clone = clone;

        element.style.opacity = '0.35';
      }, { passive: false });
    }

    function renderTaskPanel() {
      const panel = document.getElementById('task-panel');
      if (!panel) return;

      const placed = gameState.countries.filter(c => c.placed).length;
      const total = gameState.countries.length;
      const activeCountry = gameState.countries.find(c => !c.placed);

      let html = '';

      if (activeCountry) {
        html += `<div class="current-flag-card" data-id="${activeCountry.id}">
          <div class="current-flag-emoji">${activeCountry.flag}</div>
          <div class="current-flag-name">${activeCountry.name}</div>
          <div class="drag-hint">拖拽到地图上的正确位置</div>
        </div>`;
      }

      html += '<div class="flag-queue">';
      gameState.countries.forEach((country) => {
        const isActive = !country.placed && country === activeCountry;
        const isCompleted = country.placed;
        const cls = isCompleted ? 'completed' : (isActive ? 'active' : '');
        html += `<div class="flag-queue-item ${cls}" data-id="${country.id}">
          <span class="queue-emoji">${country.flag}</span>
          <span class="queue-name">${country.name}</span>
        </div>`;
      });
      html += '</div>';

      html += `<div class="progress-bar-container">
        <div class="progress-label"><span>进度</span><span>${placed} / ${total}</span></div>
        <div class="progress-bar">
          <div class="progress-bar-fill" style="width:${total > 0 ? (placed / total * 100) : 0}%"></div>
        </div>
      </div>`;

      panel.innerHTML = html;

      if (activeCountry) {
        const cardEl = panel.querySelector('.current-flag-card');
        if (cardEl) bindDragEvents(cardEl, activeCountry);
        const activeEl = panel.querySelector('.flag-queue-item.active');
        if (activeEl) bindDragEvents(activeEl, activeCountry);
      }

      // Global touch move and end handlers (attached once)
      if (!window._touchHandlersAttached) {
        window._touchHandlersAttached = true;

        document.addEventListener('touchmove', (e) => {
          if (!touchDragState.active || !touchDragState.clone) return;
          e.preventDefault();
          const touch = e.touches[0];
          touchDragState.clone.style.left = (touch.clientX - touchDragState.clone.offsetWidth / 2) + 'px';
          touchDragState.clone.style.top = (touch.clientY - 30) + 'px';

          touchDragState.clone.style.display = 'none';
          const el = document.elementFromPoint(touch.clientX, touch.clientY);
          touchDragState.clone.style.display = '';

          if (touchDragState.highlightedPath) {
            touchDragState.highlightedPath.classList.remove('drag-highlight');
            touchDragState.highlightedPath = null;
          }

          if (el) {
            const path = el.closest('.country-path');
            if (path && !path.classList.contains('filled')) {
              path.classList.add('drag-highlight');
              touchDragState.highlightedPath = path;
            }
          }
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
          if (!touchDragState.active) return;
          const touch = e.changedTouches[0];

          if (touchDragState.clone) {
            touchDragState.clone.remove();
            touchDragState.clone = null;
          }

          if (touchDragState.highlightedPath) {
            touchDragState.highlightedPath.classList.remove('drag-highlight');
            touchDragState.highlightedPath = null;
          }

          const el = document.elementFromPoint(touch.clientX, touch.clientY);
          let targetId = null;
          if (el) {
            const path = el.closest('.country-path');
            if (path) targetId = path.dataset.id;
            const slot = el.closest('.slot-marker');
            if (slot) targetId = slot.dataset.id;
            const hitArea = el.closest('.drag-hit-area');
            if (hitArea) targetId = hitArea.dataset.id;
          }

          if (touchDragState.chip) {
            touchDragState.chip.style.opacity = '1';
          }

          if (targetId && touchDragState.countryId) {
            if (touchDragState.countryId === targetId) {
              placeFlag(touchDragState.countryId, targetId);
            } else {
              wrongDrop(touchDragState.countryId, targetId);
            }
          }

          touchDragState.active = false;
          touchDragState.countryId = null;
          touchDragState.chip = null;
        });
      }
    }

    function renderSlotMarkers() {
      const container = document.getElementById('slot-markers');
      const hitAreasContainer = document.getElementById('drag-hit-areas');
      container.innerHTML = '';
      if (hitAreasContainer) hitAreasContainer.innerHTML = '';

      gameState.countries.forEach(country => {
        if (country.placed) return;
        const pos = getCountryScreenPosition(country.id);
        if (!pos) return;

        const marker = document.createElement('div');
        marker.className = 'slot-marker';
        marker.dataset.id = country.id;
        marker.textContent = '?';
        marker.style.left = pos[0] + 'px';
        marker.style.top = pos[1] + 'px';
        container.appendChild(marker);

        // Invisible larger hit area for easier dropping
        if (hitAreasContainer) {
          const hitArea = document.createElement('div');
          hitArea.className = 'drag-hit-area';
          hitArea.dataset.id = country.id;
          hitArea.style.left = pos[0] + 'px';
          hitArea.style.top = pos[1] + 'px';

          hitArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            marker.style.borderColor = 'var(--gold-light)';
            marker.style.transform = 'translate(-50%, -50%) scale(1.15)';
          });
          hitArea.addEventListener('dragleave', () => {
            marker.style.borderColor = '';
            marker.style.transform = '';
          });
          hitArea.addEventListener('drop', (e) => {
            e.preventDefault();
            marker.style.borderColor = '';
            marker.style.transform = '';
            const draggedId = e.dataTransfer.getData('text/plain');
            if (draggedId === country.id) {
              placeFlag(draggedId, country.id);
            } else {
              wrongDrop(draggedId, country.id);
            }
          });

          hitAreasContainer.appendChild(hitArea);
        }
      });

    }

    function getCountryScreenPosition(countryId) {
      const country = (COUNTRY_DATA[gameState.continent] || []).find(c => c.id === countryId);
      if (!country || !leafletMap) return null;
      const pt = leafletMap.latLngToContainerPoint([country.centroid[1], country.centroid[0]]);
      return [pt.x, pt.y];
    }

    function placeFlag(countryId, targetId) {
      const svg = document.getElementById('map-svg');
      const targetPath = svg.querySelector(`path[data-id="${targetId}"]`);
      const marker = document.querySelector(`.slot-marker[data-id="${targetId}"]`);
      const country = gameState.countries.find(c => c.id === countryId);
      if (!country || !targetPath) return;

      // Increment score
      gameState.score++;
      country.placed = true;
      renderSlotMarkers();
      playSound('correct');

      // Update score display with pop animation
      const scoreEl = document.getElementById('game-score');
      scoreEl.textContent = `${gameState.score} / ${gameState.countries.length}`;
      scoreEl.style.animation = 'none';
      scoreEl.offsetHeight; // force reflow
      scoreEl.style.animation = 'score-pop 0.3s ease';

      // Mark SVG path as filled (green)
      targetPath.classList.add('filled');

      // Create flag marker at country position (animated drop)
      const pos = getCountryScreenPosition(targetId);
      if (pos) {
        const flagMarker = document.createElement('div');
        flagMarker.className = 'flag-marker';
        flagMarker.textContent = country.flag;
        flagMarker.style.left = pos[0] + 'px';
        flagMarker.style.top = pos[1] + 'px';
        document.getElementById('flag-markers').appendChild(flagMarker);

        // Add country name label
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', pos[0]);
        text.setAttribute('y', parseFloat(pos[1]) + 20);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '10');
        text.setAttribute('fill', '#3B2C35');
        text.setAttribute('font-family', "'Comic Sans MS', 'Chalkboard SE', 'PingFang SC', 'Microsoft YaHei', sans-serif");
        text.setAttribute('font-weight', '700');
        text.setAttribute('stroke', '#FFFFFF');
        text.setAttribute('stroke-width', '3');
        text.setAttribute('paint-order', 'stroke');
        text.setAttribute('pointer-events', 'none');
        text.textContent = country.name;
        svg.appendChild(text);
      }

      // Update task panel
      renderTaskPanel();

      // Check if all flags placed
      if (gameState.score === gameState.countries.length) {
        gameState.isComplete = true;
        stopTimer();
        playSound('complete');
        setTimeout(() => {
          showResult();
          showPage('result');
        }, 500);
      }
    }

    function wrongDrop(countryId, wrongTargetId) {
      const svg = document.getElementById('map-svg');
      const targetPath = svg.querySelector(`path[data-id="${wrongTargetId}"]`);
      const marker = document.querySelector(`.slot-marker[data-id="${wrongTargetId}"]`);

      // Add to errors
      gameState.errors.push({ dragged: countryId, target: wrongTargetId });
      playSound('wrong');

      // Flash target country red
      if (targetPath) {
        targetPath.classList.add('wrong-flash');
        setTimeout(() => targetPath.classList.remove('wrong-flash'), 500);
      }

      // Flash slot marker
      if (marker) {
        marker.classList.add('wrong');
        marker.textContent = '✕';
        setTimeout(() => {
          marker.classList.remove('wrong');
          marker.textContent = '?';
        }, 500);
      }
    }

    // ===== Timer Functions =====

    function startTimer() {
      stopTimer();
      const display = document.getElementById('game-timer');
      display.textContent = '00:00';
      gameState.timerInterval = setInterval(() => {
        const elapsed = getElapsedTime();
        const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const secs = (elapsed % 60).toString().padStart(2, '0');
        display.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      if (gameState.timerInterval) {
        clearInterval(gameState.timerInterval);
        gameState.timerInterval = null;
      }
    }

    function getElapsedTime() {
      if (!gameState.startTime) return 0;
      return Math.floor((Date.now() - gameState.startTime - gameState.pausedTime) / 1000);
    }

    function togglePause() {
      if (gameState.isComplete) return;
      gameState.paused = !gameState.paused;
      if (gameState.paused) {
        gameState.pauseStart = Date.now();
        stopTimer();
      } else {
        gameState.pausedTime += Date.now() - gameState.pauseStart;
        startTimer();
      }
      const btn = document.getElementById('pause-btn');
      btn.textContent = gameState.paused ? '▶' : '⏸';
      document.getElementById('task-panel').style.opacity = gameState.paused ? '0.5' : '1';
      // Block all interaction while paused, otherwise the frozen timer
      // becomes an unfair thinking-time exploit
      document.getElementById('page-game').classList.toggle('paused', gameState.paused);
    }

    // ===== Result Page =====

    function showResult() {
      const total = gameState.countries.length;
      const score = gameState.score;
      const wrongCount = gameState.errors.length;
      const elapsed = getElapsedTime();
      const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const secs = (elapsed % 60).toString().padStart(2, '0');
      const continent = CONTINENTS[gameState.continent];

      // Title and subtitle
      document.getElementById('result-title').textContent = score === total ? '完美通关！' : '挑战完成！';
      document.getElementById('result-subtitle').textContent = `${continent.emoji} ${continent.name} - 共 ${total} 个国家`;

      // Best score badge
      const isNewRecord = saveBestIfBetter(gameState.continent, { score, total, errors: wrongCount, timeSec: elapsed });
      const bestEl = document.getElementById('result-best');
      if (isNewRecord) {
        bestEl.textContent = `🏆 新纪录!`;
        bestEl.classList.add('new-record');
      } else {
        const best = getBest(gameState.continent);
        bestEl.textContent = best ? `最佳: ${best.score}/${best.total} · ${formatTimeSec(best.timeSec)}` : '';
        bestEl.classList.remove('new-record');
      }

      // Score ring (conic-gradient)
      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const ring = document.getElementById('result-score-ring');
      ring.style.background = `conic-gradient(#F59E0B 0% ${pct}%, rgba(255,255,255,0.1) ${pct}% 100%)`;
      document.getElementById('result-score-text').textContent = `${score}/${total}`;

      // Stats
      document.getElementById('result-correct').textContent = score;
      document.getElementById('result-wrong').textContent = wrongCount;
      document.getElementById('result-time').textContent = `${mins}:${secs}`;

      // Review list: every country ends up placed before the game finishes,
      // so the meaningful stat is how many attempts its slot took
      const reviewEl = document.getElementById('result-review');
      reviewEl.innerHTML = '';
      const attemptsByTarget = {};
      gameState.errors.forEach(e => {
        attemptsByTarget[e.target] = (attemptsByTarget[e.target] || 0) + 1;
      });

      gameState.countries.forEach(country => {
        const attempts = (attemptsByTarget[country.id] || 0) + 1;
        const isPerfect = attempts === 1;
        const item = document.createElement('div');
        item.className = 'review-item';
        item.innerHTML = `
          <div class="review-icon ${isPerfect ? 'correct' : 'wrong'}">${isPerfect ? '&#10003;' : '&#10007;'}</div>
          <span class="review-flag">${country.flag}</span>
          <span class="review-name">${country.name}</span>
          <span class="review-detail">${isPerfect ? '一次放对' : `尝试 ${attempts} 次`}</span>
        `;
        reviewEl.appendChild(item);
      });
    }

    function retryGame() {
      showPage('game');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const continent = CONTINENTS[gameState.continent];
          document.getElementById('game-region-name').textContent = `${continent.emoji} ${continent.name}`;
          document.getElementById('game-score').textContent = `0 / ?`;
          document.getElementById('game-timer').textContent = '00:00';
          // Clear flag markers from previous game
          document.getElementById('flag-markers').innerHTML = '';
          initGame();
        });
      });
    }

    function goHome() {
      stopTimer();
      renderContinentGrid(); // refresh best-score badges after a finished run
      showPage('home');
    }

    let hintsVisible = true;

    function toggleHints() {
      hintsVisible = !hintsVisible;
      const btn = document.getElementById('hint-toggle');
      btn.classList.toggle('off', !hintsVisible);
      document.getElementById('slot-markers').style.display = hintsVisible ? '' : 'none';
    }

    // ===== Override startGame to initialize =====
    startGame = function(key) {
      gameState.continent = key;
      showPage('game');
      // Wait a tick for layout to compute, then init
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const continent = CONTINENTS[key];
          document.getElementById('game-region-name').textContent = `${continent.emoji} ${continent.name}`;
          document.getElementById('game-score').textContent = `0 / ?`;
          document.getElementById('game-timer').textContent = '00:00';
          // Clear flag markers from previous game
          document.getElementById('flag-markers').innerHTML = '';
          initGame();
        });
      });
    };

    // ===== Render placed flags (reusable for zoom/resize) =====
    function renderPlacedFlags() {
      const svg = document.getElementById('map-svg');
      const flagMarkers = document.getElementById('flag-markers');
      // Re-apply filled class on SVG paths and rebuild flag markers
      flagMarkers.innerHTML = '';
      gameState.countries.filter(c => c.placed).forEach(c => {
        const path = svg.querySelector(`path[data-id="${c.id}"]`);
        if (path) path.classList.add('filled');
        const pos = getCountryScreenPosition(c.id);
        if (pos) {
          const fm = document.createElement('div');
          fm.className = 'flag-marker';
          fm.textContent = c.flag;
          fm.style.left = pos[0] + 'px';
          fm.style.top = pos[1] + 'px';
          fm.style.animation = 'none';
          flagMarkers.appendChild(fm);

          // Re-add country name label in SVG
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', pos[0]);
          text.setAttribute('y', parseFloat(pos[1]) + 20);
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('font-size', '10');
          text.setAttribute('fill', '#3B2C35');
          text.setAttribute('font-family', "'Comic Sans MS', 'Chalkboard SE', 'PingFang SC', 'Microsoft YaHei', sans-serif");
          text.setAttribute('font-weight', '700');
          text.setAttribute('stroke', '#FFFFFF');
          text.setAttribute('stroke-width', '3');
          text.setAttribute('paint-order', 'stroke');
          text.setAttribute('pointer-events', 'none');
          text.textContent = c.name;
          svg.appendChild(text);
        }
      });
    }

    // ===== Zoom Functions =====
    function zoomMap(delta) {
      if (!leafletMap) return;
      const newZoom = leafletMap.getZoom() + delta;
      leafletMap.setZoom(newZoom);
      const slider = document.getElementById('zoom-slider');
      if (slider) slider.value = newZoom;
    }

    function setMapZoom(val) {
      if (!leafletMap) return;
      leafletMap.setZoom(parseFloat(val));
    }

    // ===== Window Resize Handler =====
    window.addEventListener('resize', () => {
      if (leafletMap && gameState.continent) {
        leafletMap.invalidateSize();
        setTimeout(() => {
          resetOverlayTransform();
          renderSvgOverlay(COUNTRY_DATA[gameState.continent] || []);
          renderSlotMarkers();
          renderPlacedFlags();
        }, 100);
      }
    });
  </script>
</body>
