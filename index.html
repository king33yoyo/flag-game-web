<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>世界插旗挑战</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* ===== Global Reset ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ===== Design Tokens ===== */
    :root {
      --glass-bg: rgba(15, 23, 42, 0.75);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-blur: 20px;
      --gold-primary: #F59E0B;
      --gold-light: #FBBF24;
      --gold-dark: #D97706;
      --gold-glow: rgba(245, 158, 11, 0.4);
      --dark-surface: #0F172A;
      --dark-card: rgba(30, 41, 59, 0.8);
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --cyan-fill: rgba(56, 189, 248, 0.12);
      --cyan-stroke: rgba(56, 189, 248, 0.4);
      --cyan-hover-fill: rgba(56, 189, 248, 0.3);
      --cyan-hover-stroke: rgba(56, 189, 248, 0.7);
    }

    /* ===== Base Styles ===== */
    body {
      font-family: 'Comic Neue', cursive;
      background: #111111;
      color: #E5E7EB;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: none;
    }

    h1, h2, h3 {
      font-family: 'Baloo 2', cursive;
    }

    /* ===== Page Switching ===== */
    .page {
      display: none;
      flex-direction: column;
      height: 100vh;
      touch-action: none;
    }

    .page.visible {
      display: flex;
    }

    /* ===== Claymorphism Utility Classes ===== */
    .clay {
      background: #FFFFFF;
      border-radius: 20px;
      border: 3px solid rgba(255, 255, 255, 0.7);
      box-shadow:
        8px 8px 20px rgba(79, 70, 229, 0.1),
        inset -4px -4px 8px rgba(0, 0, 0, 0.03),
        inset 4px 4px 8px rgba(255, 255, 255, 0.8);
    }

    .clay-accent {
      background: #4F46E5;
      color: #FFFFFF;
      border-radius: 20px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow:
        8px 8px 20px rgba(79, 70, 229, 0.15),
        inset -4px -4px 8px rgba(0, 0, 0, 0.1),
        inset 4px 4px 8px rgba(255, 255, 255, 0.15);
    }

    /* ===== Navigation Bar ===== */
    .nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #1A1A2E;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Baloo 2', cursive;
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-logo svg {
      width: 32px;
      height: 32px;
    }

    .nav-spacer {
      width: 60px;
    }

    /* ===== Home Page ===== */
    .home-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 24px 24px;
      gap: 0;
      position: relative;
      overflow: hidden;
      background: #000000;
    }

    .home-content::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 800px;
      height: 800px;
      transform: translate(-50%, -50%);
      background: url('https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?w=800&h=800&fit=crop') center/cover no-repeat;
      border-radius: 50%;
      opacity: 0.35;
      pointer-events: none;
    }

    .home-content::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 15%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.95) 100%);
      pointer-events: none;
    }

    .hero-section {
      text-align: center;
      position: relative;
      z-index: 1;
      margin-top: 120px;
      margin-bottom: 32px;
      flex-shrink: 0;
    }

    .hero-badge {
      display: inline-block;
      padding: 8px 22px;
      border-radius: 100px;
      background: #3B82F6;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
      font-family: 'SimHei', 'Microsoft YaHei', sans-serif;
    }

    .hero-section h1 {
      font-size: 3.8rem;
      line-height: 1.2;
      color: #FFFFFF;
      margin-bottom: 16px;
      font-family: 'SimHei', 'Microsoft YaHei', sans-serif;
    }

    .hero-section h1 .highlight {
      background: linear-gradient(135deg, #F97316, #F59E0B);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      font-size: 1.4rem;
      color: #9CA3AF;
      font-weight: 400;
      font-family: 'SimHei', 'Microsoft YaHei', sans-serif;
    }

    .continent-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      max-width: 1200px;
      width: 100%;
      position: relative;
      z-index: 1;
      flex: 1;
      align-content: end;
      padding-bottom: 32px;
    }

    .continent-card {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      cursor: pointer;
      height: 250px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
      opacity: 0;
      animation: cardEntry 0.5s ease forwards;
    }

    .continent-card:nth-child(1) { animation-delay: 0.05s; }
    .continent-card:nth-child(2) { animation-delay: 0.1s; }
    .continent-card:nth-child(3) { animation-delay: 0.15s; }
    .continent-card:nth-child(4) { animation-delay: 0.2s; }
    .continent-card:nth-child(5) { animation-delay: 0.25s; }
    .continent-card:nth-child(6) { animation-delay: 0.3s; }

    @keyframes cardEntry {
      from { opacity: 0; transform: translateY(24px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .continent-card:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 12px 32px rgba(59, 130, 246, 0.25);
    }

    .continent-card .card-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.4s ease;
    }

    .continent-card:hover .card-bg {
      transform: scale(1.08);
    }

    .continent-card .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.7) 100%);
    }

    .continent-card .card-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      z-index: 1;
    }

    .continent-card .card-name {
      font-family: 'SimHei', 'Microsoft YaHei', sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    .continent-card .card-count {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
      font-family: 'SimHei', 'Microsoft YaHei', sans-serif;
    }

    /* ===== Slot Pulse Animation ===== */
    @keyframes gold-pulse {
      0%, 100% { border-color: var(--gold-primary); box-shadow: 0 0 8px var(--gold-glow); transform: translate(-50%, -50%) scale(1); }
      50% { border-color: var(--gold-light); box-shadow: 0 0 20px var(--gold-glow); transform: translate(-50%, -50%) scale(1.1); }
    }

    @keyframes card-glow {
      0%, 100% { box-shadow: 0 0 12px rgba(245, 158, 11, 0.15); }
      50% { box-shadow: 0 0 24px rgba(245, 158, 11, 0.3); }
    }

    @keyframes flag-drop {
      0% { opacity: 0; transform: translate(-50%, -150%); }
      60% { transform: translate(-50%, -90%); }
      100% { opacity: 1; transform: translate(-50%, -100%); }
    }

    @keyframes score-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    /* Touch drag clone */
    .touch-clone {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      transform: scale(1.15) rotate(-2deg);
      opacity: 0.92;
      filter: drop-shadow(0 6px 12px rgba(245, 158, 11, 0.3));
      background: var(--dark-card);
      border: 1px solid var(--gold-primary);
      border-radius: 10px;
      padding: 6px 12px;
      color: var(--text-primary);
      font-family: 'Baloo 2', cursive;
      font-weight: 600;
    }

    /* Country highlight for drag */
    .country-path.drag-highlight {
      fill: rgba(56, 189, 248, 0.35);
      stroke: rgba(56, 189, 248, 0.8);
      stroke-width: 2.5;
    }

    .country-path.filled {
      fill: rgba(34, 197, 94, 0.35);
      stroke: #22C55E;
      stroke-width: 2;
      pointer-events: none;
    }

    /* ===== Game Page ===== */
    #page-game {
      flex-direction: row !important;
      padding-top: 60px;
    }

    .map-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .game-header {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      z-index: 10;
      min-width: 280px;
      gap: 12px;
    }

    .game-header .back-btn {
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: color 0.2s;
      padding: 4px 8px;
    }

    .game-header .back-btn:hover {
      color: var(--gold-primary);
    }

    .game-header .region-name {
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-primary);
    }

    .game-header .header-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .game-header .score-display {
      font-family: 'Baloo 2', cursive;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--gold-primary);
    }

    .game-header .timer-display {
      font-family: 'Baloo 2', cursive;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .game-header .hint-toggle {
      background: none;
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--gold-primary);
      font-size: 1rem;
      cursor: pointer;
      padding: 4px 8px;
      transition: all 0.2s;
      opacity: 1;
    }

    .game-header .hint-toggle.off {
      opacity: 0.4;
      color: var(--text-secondary);
    }

    .game-header .hint-toggle:hover {
      border-color: var(--gold-primary);
    }

    .map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    .slot-marker {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: 14px;
      color: var(--gold-primary);
      transform: translate(-50%, -50%);
      animation: gold-pulse 2s ease-in-out infinite;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .slot-marker.filled {
      background: rgba(34, 197, 94, 0.3);
      border-color: #22C55E;
      color: #FFFFFF;
      animation: none;
      font-size: 16px;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.3);
    }

    .slot-marker.wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: #EF4444;
      color: #EF4444;
      animation: none;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
    }

    /* ===== Task Panel ===== */
    .task-panel {
      width: 280px;
      flex-shrink: 0;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 16px;
      overflow-y: auto;
      touch-action: pan-y;
    }

    .task-panel::-webkit-scrollbar {
      width: 4px;
    }

    .task-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    .current-flag-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      background: var(--dark-card);
      border: 1px solid var(--gold-primary);
      border-radius: 16px;
      animation: card-glow 2s ease-in-out infinite;
      text-align: center;
      cursor: grab;
      user-select: none;
    }

    .current-flag-card .current-flag-emoji {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    .current-flag-card .current-flag-name {
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-primary);
    }

    .current-flag-card .drag-hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .flag-queue {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .flag-queue-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      user-select: none;
      transition: background 0.2s, border-color 0.2s;
      border: 1px solid transparent;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .flag-queue-item.active {
      background: rgba(245, 158, 11, 0.1);
      border-color: rgba(245, 158, 11, 0.3);
      color: var(--text-primary);
      cursor: grab;
    }

    .flag-queue-item.completed {
      text-decoration: line-through;
      opacity: 0.5;
      cursor: default;
    }

    .flag-queue-item .queue-emoji {
      font-size: 1.2rem;
    }

    .flag-queue-item .queue-name {
      flex: 1;
      font-family: 'Baloo 2', cursive;
      font-weight: 500;
    }

    .progress-bar-container {
      margin-top: auto;
      padding-top: 8px;
    }

    .progress-bar-container .progress-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .progress-bar {
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
      transition: width 0.4s ease;
    }

    /* ===== Drag Hit Area ===== */
    .drag-hit-area {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      cursor: pointer;
      pointer-events: auto;
    }

    /* ===== Zoom Controls ===== */
    .zoom-controls {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 8px;
    }

    .zoom-controls button {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .zoom-controls button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .zoom-controls input[type="range"] {
      writing-mode: vertical-lr;
      direction: rtl;
      width: 28px;
      height: 100px;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
    }

    .zoom-controls input[type="range"]::-webkit-slider-runnable-track {
      width: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    .zoom-controls input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--gold-primary);
      cursor: pointer;
      margin-left: -5px;
    }

    .country-path {
      fill: rgba(56, 189, 248, 0.12);
      stroke: rgba(56, 189, 248, 0.4);
      stroke-width: 1.5;
      stroke-linejoin: round;
      cursor: pointer;
      transition: fill 0.2s ease, stroke 0.2s ease;
    }

    .country-path:hover {
      fill: rgba(56, 189, 248, 0.3);
      stroke: rgba(56, 189, 248, 0.7);
      stroke-width: 2.5;
    }

    .country-path.wrong-flash {
      fill: rgba(239, 68, 68, 0.3);
      stroke: #EF4444;
    }

    /* ===== Flag Marker (placed on map) ===== */
    .flag-marker {
      position: absolute;
      font-size: 24px;
      transform: translate(-50%, -100%);
      pointer-events: none;
      animation: flag-drop 0.4s ease-out forwards;
      z-index: 5;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    /* ===== Result Page ===== */
    .result-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px 40px;
      gap: 24px;
      overflow-y: auto;
      background: var(--dark-surface);
    }

    .result-card {
      max-width: 440px;
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      background: var(--dark-card);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
    }

    .result-header {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
      padding: 28px 24px 20px;
      text-align: center;
      position: relative;
    }

    .result-header .trophy {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .result-header h2 {
      font-size: 1.6rem;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .result-header .result-subtitle {
      font-size: 0.9rem;
      color: var(--gold-primary);
      margin-bottom: 16px;
    }

    .score-ring {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .score-ring-inner {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--dark-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: 1.2rem;
      color: #FFFFFF;
    }

    .result-stats {
      display: flex;
      gap: 0;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .result-stat {
      flex: 1;
      text-align: center;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .result-stat:last-child {
      border-right: none;
    }

    .result-stat .stat-value {
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: 1.3rem;
    }

    .result-stat .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .stat-correct .stat-value { color: #4ADE80; }
    .stat-wrong .stat-value { color: #F87171; }
    .stat-time .stat-value { color: var(--gold-primary); }

    .result-review {
      padding: 16px 20px;
      max-height: 240px;
      overflow-y: auto;
    }

    .result-review::-webkit-scrollbar {
      width: 4px;
    }

    .result-review::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    .review-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .review-item:last-child {
      border-bottom: none;
    }

    .review-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .review-icon.correct {
      background: rgba(34, 197, 94, 0.2);
      color: #4ADE80;
    }

    .review-icon.wrong {

    // ===== Sound Effects (Web Audio API) =====
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function playSound(type) {
      try {
        const ctx = getAudioCtx();
        if (type === 'correct') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = 800;
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.15);
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = 300;
          osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.2);
        } else if (type === 'complete') {
          [523, 659, 784].forEach((freq, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.frequency.value = freq;
            o.type = 'sine';
            g.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.15);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.2);
            o.start(ctx.currentTime + i * 0.15);
            o.stop(ctx.currentTime + i * 0.15 + 0.2);
          });
        }

    // ===== Game Rendering Functions =====

    function initGame() {
      const allCountries = COUNTRY_DATA[gameState.continent] || [];
      const shuffled = [...allCountries].sort(() => Math.random() - 0.5);
      gameState.countries = shuffled.slice(0, Math.min(10, shuffled.length)).map(c => ({...c, placed: false}));
      gameState.score = 0;
      gameState.errors = [];
      gameState.isComplete = false;
      gameState.startTime = Date.now();
      startTimer();
      renderMap();
      renderTaskPanel();
    }

    function renderMap() {
      const container = document.getElementById('map-container');
      const rect = container.getBoundingClientRect();
      const width = rect.width || 800;
      const height = rect.height || 500;

      // Initialize or update Leaflet map
      if (!leafletMap) {
        leafletMap = L.map('leaflet-map', {
          zoomControl: false,
          attributionControl: false,
          dragging: true,
          scrollWheelZoom: true,
          doubleClickZoom: false,
          touchZoom: true,
          keyboard: false,
          boxZoom: false,
          zoomSnap: 0.5
        });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
          maxZoom: 19,
          opacity: 0.7
        }).addTo(leafletMap);
      }

      // Fit to continent bounds
      const countries = COUNTRY_DATA[gameState.continent] || [];
      let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
      forEachCoord(countries, (lon, lat) => {
        // For Europe, exclude Russia's far-east (negative longitudes) and clip to main Europe
        if (gameState.continent === 'europe') {
          if (lon < -10) return;  // skip far-east Russia, Kamchatka etc.
          if (lon > 45) lon = 45;
          if (lat > 72) lat = 72;
        }
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
      });
      const pad = gameState.continent === 'europe' ? 2 : 1;
      leafletMap.fitBounds([[minLat - pad, minLon - pad], [maxLat + pad, maxLon + pad]], { animate: false });
      const zoomByContinent = { asia: 0.25, africa: 0.2, oceania: 0.05, 'south-america': 0.2, 'north-america': 0.2 };
      const extraZoom = zoomByContinent[gameState.continent] || 0;
      if (extraZoom) {
        leafletMap.setZoom(leafletMap.getZoom() + extraZoom, { animate: false });
      }

      // Sync zoom slider
      const slider = document.getElementById('zoom-slider');
      if (slider) {
        slider.min = 1;
        slider.max = 8;
        slider.step = 0.5;
        slider.value = leafletMap.getZoom();
      }

      // Listen for zoom changes to sync SVG overlay and markers
      if (!leafletMap._zoomHandlerAttached) {
        leafletMap.on('zoomend', () => {
          const slider = document.getElementById('zoom-slider');
          if (slider) slider.value = leafletMap.getZoom();
          renderSvgOverlay(COUNTRY_DATA[gameState.continent] || []);
          renderSlotMarkers();
          renderPlacedFlags();
        });
        leafletMap.on('moveend', () => {
          renderSvgOverlay(COUNTRY_DATA[gameState.continent] || []);
          renderSlotMarkers();
          renderPlacedFlags();
        });
        leafletMap._zoomHandlerAttached = true;
      }

      // Wait for map to load tiles, then render SVG overlay
      setTimeout(() => {
        renderSvgOverlay(countries);
        renderSlotMarkers(); // 必须在 SVG 渲染之后，才能绑定 country-path 事件
      }, 300);
    }

    function renderSvgOverlay(countries) {
      const svg = document.getElementById('map-svg');
      const container = document.getElementById('map-container');
      const rect = container.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;

      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);

      let svgContent = '';
      countries.forEach(country => {
        const rings = country.geo.type === 'MultiPolygon'
          ? country.geo.coordinates.map(p => p[0])
          : [country.geo.coordinates[0]];

        rings.forEach(ring => {
          const points = ring.map(([lon, lat]) => {
            const pt = leafletMap.latLngToContainerPoint([lat, lon]);
            return `${pt.x.toFixed(1)},${pt.y.toFixed(1)}`;
          });
          if (points.length > 2) {
            svgContent += `<path d="M${points.join('L')}Z" class="country-path" data-id="${country.id}" data-name="${country.name}" stroke-linejoin="round"/>`;
          }
        });
      });
      svg.innerHTML = svgContent;

      // Enable pointer events on country paths
      svg.querySelectorAll('.country-path').forEach(path => {
        path.style.pointerEvents = 'auto';
        path.addEventListener('mouseenter', () => {
          if (!path.classList.contains('filled')) {
            path.style.fill = 'rgba(56, 189, 248, 0.3)';
            path.style.stroke = 'rgba(56, 189, 248, 0.7)';
            path.style.strokeWidth = '2.5';
          }
        });
        path.addEventListener('mouseleave', () => {
          if (!path.classList.contains('filled')) {
            path.style.fill = 'rgba(56, 189, 248, 0.12)';
            path.style.stroke = 'rgba(56, 189, 248, 0.4)';
            path.style.strokeWidth = '1.5';
          }
        });
      });
    }

    function bindDragEvents(element, country) {
      element.draggable = true;
      element.dataset.id = country.id;

      element.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', country.id);
        e.dataTransfer.effectAllowed = 'move';
        requestAnimationFrame(() => {
          element.style.opacity = '0.5';
        });
      });
      element.addEventListener('dragend', () => {
        element.style.opacity = '1';
      });

      element.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        touchDragState.active = true;
        touchDragState.countryId = country.id;
        touchDragState.chip = element;

        const clone = document.createElement('div');
        clone.className = 'touch-clone';
        clone.textContent = country.flag + ' ' + country.name;
        clone.style.left = (touch.clientX - 50) + 'px';
        clone.style.top = (touch.clientY - 30) + 'px';
        document.body.appendChild(clone);
        touchDragState.clone = clone;

        element.style.opacity = '0.35';
      }, { passive: false });
    }

    function renderTaskPanel() {
      const panel = document.getElementById('task-panel');
      if (!panel) return;

      const placed = gameState.countries.filter(c => c.placed).length;
      const total = gameState.countries.length;
      const activeCountry = gameState.countries.find(c => !c.placed);

      let html = '';

      if (activeCountry) {
        html += `<div class="current-flag-card" data-id="${activeCountry.id}">
          <div class="current-flag-emoji">${activeCountry.flag}</div>
          <div class="current-flag-name">${activeCountry.name}</div>
          <div class="drag-hint">拖拽到地图上的正确位置</div>
        </div>`;
      }

      html += '<div class="flag-queue">';
      gameState.countries.forEach((country) => {
        const isActive = !country.placed && country === activeCountry;
        const isCompleted = country.placed;
        const cls = isCompleted ? 'completed' : (isActive ? 'active' : '');
        html += `<div class="flag-queue-item ${cls}" data-id="${country.id}">
          <span class="queue-emoji">${country.flag}</span>
          <span class="queue-name">${country.name}</span>
        </div>`;
      });
      html += '</div>';

      html += `<div class="progress-bar-container">
        <div class="progress-label"><span>进度</span><span>${placed} / ${total}</span></div>
        <div class="progress-bar">
          <div class="progress-bar-fill" style="width:${total > 0 ? (placed / total * 100) : 0}%"></div>
        </div>
      </div>`;

      panel.innerHTML = html;

      if (activeCountry) {
        const cardEl = panel.querySelector('.current-flag-card');
        if (cardEl) bindDragEvents(cardEl, activeCountry);
        const activeEl = panel.querySelector('.flag-queue-item.active');
        if (activeEl) bindDragEvents(activeEl, activeCountry);
      }

      // Global touch move and end handlers (attached once)
      if (!window._touchHandlersAttached) {
        window._touchHandlersAttached = true;

        document.addEventListener('touchmove', (e) => {
          if (!touchDragState.active || !touchDragState.clone) return;
          e.preventDefault();
          const touch = e.touches[0];
          touchDragState.clone.style.left = (touch.clientX - touchDragState.clone.offsetWidth / 2) + 'px';
          touchDragState.clone.style.top = (touch.clientY - 30) + 'px';

          touchDragState.clone.style.display = 'none';
          const el = document.elementFromPoint(touch.clientX, touch.clientY);
          touchDragState.clone.style.display = '';

          if (touchDragState.highlightedPath) {
            touchDragState.highlightedPath.classList.remove('drag-highlight');
            touchDragState.highlightedPath = null;
          }

          if (el) {
            const path = el.closest('.country-path');
            if (path && !path.classList.contains('filled')) {
              path.classList.add('drag-highlight');
              touchDragState.highlightedPath = path;
            }
          }
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
          if (!touchDragState.active) return;
          const touch = e.changedTouches[0];

          if (touchDragState.clone) {
            touchDragState.clone.remove();
            touchDragState.clone = null;
          }

          if (touchDragState.highlightedPath) {
            touchDragState.highlightedPath.classList.remove('drag-highlight');
            touchDragState.highlightedPath = null;
          }

          const el = document.elementFromPoint(touch.clientX, touch.clientY);
          let targetId = null;
          if (el) {
            const path = el.closest('.country-path');
            if (path) targetId = path.dataset.id;
            const slot = el.closest('.slot-marker');
            if (slot) targetId = slot.dataset.id;
            const hitArea = el.closest('.drag-hit-area');
            if (hitArea) targetId = hitArea.dataset.id;
          }

          if (touchDragState.chip) {
            touchDragState.chip.style.opacity = '1';
          }

          if (targetId && touchDragState.countryId) {
            if (touchDragState.countryId === targetId) {
              placeFlag(touchDragState.countryId, targetId);
            } else {
              wrongDrop(touchDragState.countryId, targetId);
            }
          }

          touchDragState.active = false;
          touchDragState.countryId = null;
          touchDragState.chip = null;
        });
      }
    }

    function renderSlotMarkers() {
      const container = document.getElementById('slot-markers');
      const hitAreasContainer = document.getElementById('drag-hit-areas');
      container.innerHTML = '';
      if (hitAreasContainer) hitAreasContainer.innerHTML = '';

      gameState.countries.forEach(country => {
        const pos = getCountryScreenPosition(country.id);
        if (!pos) return;

        const marker = document.createElement('div');
        marker.className = 'slot-marker';
        marker.dataset.id = country.id;
        marker.textContent = '?';
        marker.style.left = pos[0] + 'px';
        marker.style.top = pos[1] + 'px';
        container.appendChild(marker);

        // Invisible larger hit area for easier dropping
        if (hitAreasContainer) {
          const hitArea = document.createElement('div');
          hitArea.className = 'drag-hit-area';
          hitArea.dataset.id = country.id;
          hitArea.style.left = pos[0] + 'px';
          hitArea.style.top = pos[1] + 'px';

          hitArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            marker.style.borderColor = 'var(--gold-light)';
            marker.style.transform = 'translate(-50%, -50%) scale(1.15)';
          });
          hitArea.addEventListener('dragleave', () => {
            marker.style.borderColor = '';
            marker.style.transform = '';
          });
          hitArea.addEventListener('drop', (e) => {
            e.preventDefault();
            marker.style.borderColor = '';
            marker.style.transform = '';
            const draggedId = e.dataTransfer.getData('text/plain');
            if (draggedId === country.id) {
              placeFlag(draggedId, country.id);
            } else {
              wrongDrop(draggedId, country.id);
            }
          });

          hitAreasContainer.appendChild(hitArea);
        }
      });

      // Also add dragover/drop on country paths for desktop
      const svg = document.getElementById('map-svg');
      svg.querySelectorAll('.country-path').forEach(path => {
        path.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (!path.classList.contains('filled')) {
            path.classList.add('drag-highlight');
          }
        });
        path.addEventListener('dragleave', () => {
          path.classList.remove('drag-highlight');
        });
        path.addEventListener('drop', (e) => {
          e.preventDefault();
          path.classList.remove('drag-highlight');
          const draggedId = e.dataTransfer.getData('text/plain');
          const targetId = path.dataset.id;
          if (draggedId === targetId) {
            placeFlag(draggedId, targetId);
          } else {
            wrongDrop(draggedId, targetId);
          }
        });
      });
    }

    function getCountryScreenPosition(countryId) {
      const country = (COUNTRY_DATA[gameState.continent] || []).find(c => c.id === countryId);
      if (!country || !leafletMap) return null;
      const pt = leafletMap.latLngToContainerPoint([country.centroid[1], country.centroid[0]]);
      return [pt.x, pt.y];
    }

    function placeFlag(countryId, targetId) {
      const svg = document.getElementById('map-svg');
      const targetPath = svg.querySelector(`path[data-id="${targetId}"]`);
      const marker = document.querySelector(`.slot-marker[data-id="${targetId}"]`);
      const country = gameState.countries.find(c => c.id === countryId);
      if (!country || !targetPath) return;

      // Increment score
      gameState.score++;
      country.placed = true;
      playSound('correct');

      // Update score display with pop animation
      const scoreEl = document.getElementById('game-score');
      scoreEl.textContent = `${gameState.score} / ${gameState.countries.length}`;
      scoreEl.style.animation = 'none';
      scoreEl.offsetHeight; // force reflow
      scoreEl.style.animation = 'score-pop 0.3s ease';

      // Mark SVG path as filled (green)
      targetPath.classList.add('filled');

      // Remove corresponding slot marker
      if (marker) {
        marker.style.display = 'none';
      }

      // Create flag marker at country position (animated drop)
      const pos = getCountryScreenPosition(targetId);
      if (pos) {
        const flagMarker = document.createElement('div');
        flagMarker.className = 'flag-marker';
        flagMarker.textContent = country.flag;
        flagMarker.style.left = pos[0] + 'px';
        flagMarker.style.top = pos[1] + 'px';
        document.getElementById('flag-markers').appendChild(flagMarker);

        // Add country name label
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', pos[0]);
        text.setAttribute('y', parseFloat(pos[1]) + 20);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '10');
        text.setAttribute('fill', '#E2E8F0');
        text.setAttribute('font-family', "'Baloo 2', cursive");
        text.setAttribute('pointer-events', 'none');
        text.textContent = country.name;
        svg.appendChild(text);
      }

      // Update task panel
      renderTaskPanel();

      // Check if all flags placed
      if (gameState.score === gameState.countries.length) {
        gameState.isComplete = true;
        stopTimer();
        playSound('complete');
        setTimeout(() => {
          showResult();
          showPage('result');
        }, 500);
      }
    }

    function wrongDrop(countryId, wrongTargetId) {
      const svg = document.getElementById('map-svg');
      const targetPath = svg.querySelector(`path[data-id="${wrongTargetId}"]`);
      const marker = document.querySelector(`.slot-marker[data-id="${wrongTargetId}"]`);

      // Add to errors
      gameState.errors.push({ dragged: countryId, target: wrongTargetId });
      playSound('wrong');

      // Flash target country red
      if (targetPath) {
        targetPath.classList.add('wrong-flash');
        setTimeout(() => targetPath.classList.remove('wrong-flash'), 500);
      }

      // Flash slot marker
      if (marker) {
        marker.classList.add('wrong');
        marker.textContent = '✕';
        setTimeout(() => {
          marker.classList.remove('wrong');
          marker.textContent = '?';
        }, 500);
      }
    }

    // ===== Timer Functions =====

    function startTimer() {
      stopTimer();
      const display = document.getElementById('game-timer');
      display.textContent = '00:00';
      gameState.timerInterval = setInterval(() => {
        const elapsed = getElapsedTime();
        const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const secs = (elapsed % 60).toString().padStart(2, '0');
        display.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      if (gameState.timerInterval) {
        clearInterval(gameState.timerInterval);
        gameState.timerInterval = null;
      }
    }

    function getElapsedTime() {
      if (!gameState.startTime) return 0;
      return Math.floor((Date.now() - gameState.startTime) / 1000);
    }

    // ===== Result Page =====

    function showResult() {
      const total = gameState.countries.length;
      const score = gameState.score;
      const wrongCount = gameState.errors.length;
      const elapsed = getElapsedTime();
      const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const secs = (elapsed % 60).toString().padStart(2, '0');
      const continent = CONTINENTS[gameState.continent];

      // Title and subtitle
      document.getElementById('result-title').textContent = score === total ? '完美通关！' : '挑战完成！';
      document.getElementById('result-subtitle').textContent = `${continent.emoji} ${continent.name} - 共 ${total} 个国家`;

      // Score ring (conic-gradient)
      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const ring = document.getElementById('result-score-ring');
      ring.style.background = `conic-gradient(#F59E0B 0% ${pct}%, rgba(255,255,255,0.1) ${pct}% 100%)`;
      document.getElementById('result-score-text').textContent = `${score}/${total}`;

      // Stats
      document.getElementById('result-correct').textContent = score;
      document.getElementById('result-wrong').textContent = wrongCount;
      document.getElementById('result-time').textContent = `${mins}:${secs}`;

      // Review list
      const reviewEl = document.getElementById('result-review');
      reviewEl.innerHTML = '';
      const errorTargets = new Set(gameState.errors.map(e => e.target));

      gameState.countries.forEach(country => {
        const isCorrect = !errorTargets.has(country.id);
        const item = document.createElement('div');
        item.className = 'review-item';
        item.innerHTML = `
          <div class="review-icon ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? '&#10003;' : '&#10007;'}</div>
          <span class="review-flag">${country.flag}</span>
          <span class="review-name">${country.name}</span>
          <span class="review-detail">${isCorrect ? '正确' : '未答对'}</span>
        `;
        reviewEl.appendChild(item);
      });
    }

    function retryGame() {
      showPage('game');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const continent = CONTINENTS[gameState.continent];
          document.getElementById('game-region-name').textContent = `${continent.emoji} ${continent.name}`;
          document.getElementById('game-score').textContent = `0 / ?`;
          document.getElementById('game-timer').textContent = '00:00';
          // Clear flag markers from previous game
          document.getElementById('flag-markers').innerHTML = '';
          initGame();
        });
      });
    }

    function goHome() {
      stopTimer();
      showPage('home');
    }

    let hintsVisible = true;

    function toggleHints() {
      hintsVisible = !hintsVisible;
      const btn = document.getElementById('hint-toggle');
      btn.classList.toggle('off', !hintsVisible);
      document.getElementById('slot-markers').style.display = hintsVisible ? '' : 'none';
    }

    // ===== Override startGame to initialize =====
    startGame = function(key) {
      gameState.continent = key;
      showPage('game');
      // Wait a tick for layout to compute, then init
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const continent = CONTINENTS[key];
          document.getElementById('game-region-name').textContent = `${continent.emoji} ${continent.name}`;
          document.getElementById('game-score').textContent = `0 / ?`;
          document.getElementById('game-timer').textContent = '00:00';
          // Clear flag markers from previous game
          document.getElementById('flag-markers').innerHTML = '';
          initGame();
        });
      });
    };

    // ===== Render placed flags (reusable for zoom/resize) =====
    function renderPlacedFlags() {
      const svg = document.getElementById('map-svg');
      const flagMarkers = document.getElementById('flag-markers');
      // Re-apply filled class on SVG paths and rebuild flag markers
      flagMarkers.innerHTML = '';
      gameState.countries.filter(c => c.placed).forEach(c => {
        const path = svg.querySelector(`path[data-id="${c.id}"]`);
        if (path) path.classList.add('filled');
        const pos = getCountryScreenPosition(c.id);
        if (pos) {
          const fm = document.createElement('div');
          fm.className = 'flag-marker';
          fm.textContent = c.flag;
          fm.style.left = pos[0] + 'px';
          fm.style.top = pos[1] + 'px';
          fm.style.animation = 'none';
          flagMarkers.appendChild(fm);

          // Re-add country name label in SVG
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', pos[0]);
          text.setAttribute('y', parseFloat(pos[1]) + 20);
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('font-size', '10');
          text.setAttribute('fill', '#E2E8F0');
          text.setAttribute('font-family', "'Baloo 2', cursive");
          text.setAttribute('pointer-events', 'none');
          text.textContent = c.name;
          svg.appendChild(text);
        }
      });
    }

    // ===== Zoom Functions =====
    function zoomMap(delta) {
      if (!leafletMap) return;
      const newZoom = leafletMap.getZoom() + delta;
      leafletMap.setZoom(newZoom);
      const slider = document.getElementById('zoom-slider');
      if (slider) slider.value = newZoom;
    }

    function setMapZoom(val) {
      if (!leafletMap) return;
      leafletMap.setZoom(parseFloat(val));
    }

    // ===== Window Resize Handler =====
    window.addEventListener('resize', () => {
      if (leafletMap && gameState.continent) {
        leafletMap.invalidateSize();
        setTimeout(() => {
          renderSvgOverlay(COUNTRY_DATA[gameState.continent] || []);
          renderSlotMarkers();
          renderPlacedFlags();
        }, 100);
      }
    });
  </script>
</body>
</html>
